# Load profile only (loadtest/compose.load.yml). 2 s scrape so short runs
# still have enough points.
global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: wallet
    static_configs:
      - targets: ["wallet-1:8080", "wallet-2:8080", "wallet-3:8080"]
  # Only up while "loadgen run" executes; down between runs is expected.
  - job_name: loadgen
    static_configs:
      - targets: ["loadgen:9100"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
